; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = v1

; ---------------------------------------------------------------------------
; One environment per physical wiring. There is no generic ESP8266 env on
; purpose: board_config.h refuses to compile without a revision, so it is not
; possible to build an image that does not say which board it is for.
;
;   v1          original wiring, A/B swapped        -> .60 (bedroom), .62 (livingroom)
;   v1_d1       same wiring on a "d1" board         -> .101 (test)
;   v1_rewired  RX/DE/RE off the strap pins         -> .61 (office)
;   v2          2026-09 PCB, hardware UART          -> new boards
;
; ota_update.sh refuses to push an image whose revision does not match what
; the target device reports on /uptime.
; ---------------------------------------------------------------------------

[esp8266_base]
platform = espressif8266
framework = arduino
monitor_speed = 115200
lib_deps = PubSubClient, ArduinoOTA, ArduinoJson, https://github.com/dumpfheimer/esp_wifi_portal.git
board_build.filesystem = littlefs
extra_scripts = pre:build_data.py

[env:v1]
extends = esp8266_base
board = d1_mini
build_flags = -I src -D BOARD_V1

[env:v1_d1]
extends = esp8266_base
board = d1
build_flags = -I src -D BOARD_V1

[env:v1_rewired]
extends = esp8266_base
board = d1_mini
build_flags = -I src -D BOARD_V1_REWIRED

[env:v2]
extends = esp8266_base
board = d1_mini
build_flags = -I src -D BOARD_V2

[env:ESP32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
lib_deps = PubSubClient, ArduinoOTA, ArduinoJson, https://github.com/dumpfheimer/esp_wifi_portal.git
build_flags = -I src
board_build.filesystem = littlefs
extra_scripts = pre:build_data.py
